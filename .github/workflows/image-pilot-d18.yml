# TEMPORARY: three-image gpt-image-2 pilot for PR #80 (D18). Manual only. Removed before merge.
# Generates to the runner's /tmp, uploads the WebPs as an artifact, commits nothing, deploys nothing.
name: image-pilot-d18

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        working-directory: pipeline
        run: npm install --no-audit --no-fund
      - name: Generate three pilot images (not committed)
        working-directory: pipeline
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PILOT_OUT: ${{ runner.temp }}/pilot-d18
        run: node --experimental-strip-types tools/image-pilot.mts
      - name: Upload pilot images and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d18-image-pilot
          path: ${{ runner.temp }}/pilot-d18
          if-no-files-found: warn
          retention-days: 14
