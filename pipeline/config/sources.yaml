# Source registry. Edit freely. tier weights ranking; clustering merges items
# across sources into one "story". type drives which connector ingests it.
#
# types: rss | youtube | arxiv | github_releases | hackernews | reddit
# tier:  1 = primary/authoritative origin, 2 = commentary/community
# primary: true = original reporting (a trade newsroom) despite being tier 2. Only
#   tier-1 OR primary items can ANCHOR a weekly deep-dive pillar; reaction/commentary
#   never can. It does NOT affect ranking (that stays tier/weight) - eligibility only.

sources:
  # --- Tier 1: official blogs & changelogs (RSS) ---
  - { name: OpenAI Blog,        type: rss, tier: 1, weight: 1.0, url: "https://openai.com/blog/rss.xml" }
  - { name: Google DeepMind,    type: rss, tier: 1, weight: 1.0, url: "https://deepmind.google/blog/rss.xml" }
  - { name: Hugging Face Blog,  type: rss, tier: 1, weight: 0.9, url: "https://huggingface.co/blog/feed.xml" }
  - { name: Mistral News,       type: rss, tier: 1, weight: 0.8, url: "https://mistral.ai/rss.xml" }

  # --- Tier 1: research & code ---
  - { name: arXiv cs.AI,        type: arxiv,           tier: 1, weight: 0.7, query: "cat:cs.AI",  maxAgeHours: 48 }
  - { name: arXiv cs.CL,        type: arxiv,           tier: 1, weight: 0.7, query: "cat:cs.CL",  maxAgeHours: 48 }
  - { name: arXiv cs.LG,        type: arxiv,           tier: 1, weight: 0.6, query: "cat:cs.LG",  maxAgeHours: 48 }
  - { name: GitHub AI releases, type: github_releases, tier: 1, weight: 0.7, repos: ["openai/openai-python","anthropics/anthropic-sdk-python","ggml-org/llama.cpp","vllm-project/vllm","langchain-ai/langchain","meta-llama/llama-stack"] }

  # --- Tier 2: community signal ---
  - { name: Hacker News (AI),   type: hackernews, tier: 2, weight: 0.8, minPoints: 150, keywords: ["AI","LLM","GPT","Claude","Gemini","model","agent","open source"] }
  - { name: r/LocalLLaMA,       type: rss, tier: 2, weight: 0.6, url: "https://www.reddit.com/r/LocalLLaMA/top/.rss?t=day" }

  # --- Tier 2: AI x digital assets (beachhead) — general feeds gated to AI-relevant items via aiFilter ---
  - { name: Domain Name Wire,   type: rss, tier: 2, primary: true, weight: 0.6, aiFilter: true, url: "https://domainnamewire.com/feed/" }
  - { name: DomainInvesting,    type: rss, tier: 2, primary: true, weight: 0.6, aiFilter: true, url: "https://domaininvesting.com/feed/" }
  - { name: TheDomains,         type: rss, tier: 2, weight: 0.5, aiFilter: true, url: "https://thedomains.com/feed/" }
  - { name: Decrypt,            type: rss, tier: 2, weight: 0.6, aiFilter: true, url: "https://decrypt.co/feed" }
  - { name: CoinDesk,           type: rss, tier: 2, primary: true, weight: 0.5, aiFilter: true, url: "https://www.coindesk.com/arc/outboundfeeds/rss/" }
  - { name: The Block,          type: rss, tier: 2, primary: true, weight: 0.5, aiFilter: true, url: "https://www.theblock.co/rss.xml" }
  - { name: CoinTelegraph,      type: rss, tier: 2, weight: 0.5, aiFilter: true, url: "https://cointelegraph.com/rss" }
  - { name: The Defiant,        type: rss, tier: 2, weight: 0.5, aiFilter: true, url: "https://thedefiant.io/feed" }

  # --- Tier 2: AI x marketing & ops (beachhead) — general marketing/SEO trade press,
  # gated to AI-relevant items via aiFilter (same pattern as digital assets) ---
